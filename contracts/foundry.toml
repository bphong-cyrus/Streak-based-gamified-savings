[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
gas_reports = ["StreakVault", "YieldDistributor", "MockYieldSource", "MockUSDC"]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"

[fmt]
line_length = 120

[lint]
lint_on_build = false

